name: Pump peak reversal research
on:
  push:
    branches:
      - research/daily-rise-before-reversal-20261011
  workflow_dispatch:
  pull_request:
    paths:
      - 'pump_peak_research.py'
      - 'test_pump_peak_research.py'
      - '.github/workflows/pump-peak-research.yml'
jobs:
  statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest -v test_pump_peak_research.py
      - run: python pump_peak_research.py
