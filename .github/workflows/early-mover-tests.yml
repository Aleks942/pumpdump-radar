name: PumpDump early movers and correct volume checks
on:
  pull_request:
    paths:
      - 'main.py'
      - 'ticker_metrics.py'
      - 'mover_discovery.py'
      - 'bybit_mover_watch.py'
      - 'multi_window_watch.py'
      - 'pump_info_audit.py'
      - 'test_pump_info_audit.py'
      - 'test_multi_window_watch.py'
      - 'test_bybit_mover_watch.py'
      - 'telegram_builder.py'
      - 'mover_forward_audit.py'
      - 'pump_lifecycle.py'
      - 'post_pump_short_research.py'
      - 'post_pump_short_evidence.py'
      - 'post_pump_spot_stream.py'
      - 'test_post_pump_spot_stream.py'
      - 'post_pump_short_strategy.py'
      - 'post_pump_early_weakening.py'
      - 'test_post_pump_early_weakening.py'
      - 'post_pump_short_paper.py'
      - 'post_pump_short_flow.py'
      - 'post_pump_context_v2.py'
      - 'test_post_pump_short_flow.py'
      - 'test_post_pump_context_v2.py'
      - 'trade_flow_collector_v3.py'
      - 'test_post_pump_short_paper.py'
      - 'test_post_pump_short_strategy.py'
      - 'post_pump_short_stage.py'
      - 'test_post_pump_short_stage.py'
      - 'test_post_pump_short_evidence.py'
      - 'test_post_pump_short_research.py'
      - 'test_pump_lifecycle.py'
      - 'test_mover_forward_audit.py'
      - 'pump_peak_watch.py'
      - 'test_mover_discovery.py'
      - 'test_pump_peak_watch.py'
      - '.github/workflows/early-mover-tests.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile post_pump_early_weakening.py test_post_pump_early_weakening.py post_pump_context_v2.py post_pump_short_flow.py test_post_pump_short_flow.py post_pump_short_paper.py test_post_pump_short_paper.py post_pump_spot_stream.py test_post_pump_spot_stream.py post_pump_short_strategy.py test_post_pump_short_strategy.py post_pump_short_stage.py test_post_pump_short_stage.py post_pump_short_evidence.py test_post_pump_short_evidence.py post_pump_short_research.py test_post_pump_short_research.py pump_info_audit.py test_pump_info_audit.py multi_window_watch.py test_multi_window_watch.py bybit_mover_watch.py test_bybit_mover_watch.py main.py ticker_metrics.py mover_discovery.py mover_forward_audit.py pump_peak_watch.py pump_lifecycle.py test_pump_lifecycle.py test_mover_discovery.py test_mover_forward_audit.py test_pump_peak_watch.py
      - run: python -m unittest -v test_post_pump_early_weakening test_post_pump_short_flow test_post_pump_context_v2 test_post_pump_short_paper test_post_pump_spot_stream test_post_pump_short_strategy test_post_pump_short_stage test_post_pump_short_evidence test_post_pump_short_research test_pump_info_audit test_multi_window_watch test_bybit_mover_watch test_mover_discovery test_mover_forward_audit test_pump_peak_watch test_pump_lifecycle
