name: Annual pump final peak and full absorption
on:
  push:
    branches: ["research/pump-first-pullback-1y"]
    paths: [".github/workflows/pump-full-cycle-year.yml", "research/pump_full_cycle_year.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Scan assigned OKX instruments
        run: python -u research/pump_full_cycle_year.py --shard ${{ matrix.shard }} --shards 8
      - uses: actions/upload-artifact@v4
        with:
          name: full-cycle-shard-${{ matrix.shard }}
          path: shard-output/
          if-no-files-found: error
  aggregate:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: full-cycle-shard-*
          path: shards
      - name: Aggregate annual peak and absorption statistics
        run: python -u research/pump_full_cycle_year.py --aggregate --shards 8
      - uses: actions/upload-artifact@v4
        with:
          name: pump-full-cycle-year
          path: full-cycle-output/
          if-no-files-found: error
