name: Pump Flow bridge regression tests

on:
  pull_request:
    paths:
      - 'flow_bridge.py'
      - 'pump_flow_confirmed.py'
      - 'test_flow_bridge.py'
      - 'test_pump_flow_confirmed.py'
      - '.github/workflows/pump_flow_tests.yml'
  workflow_dispatch:

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -m unittest -v test_flow_bridge test_pump_flow_confirmed
