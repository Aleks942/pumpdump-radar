name: SWING medium-term tests

on:
  pull_request:
    paths:
      - 'main.py'
      - 'swing_market_scanner.py'
      - 'swing_strength_engine.py'
      - 'swing_absorption.py'
      - 'test_swing_absorption.py'
      - 'swing_result_tracker.py'
      - 'swing_backtest.py'
      - 'swing_alert_state.py'
      - 'test_swing_alert_state.py'
      - 'telegram_manual_research.py'
      - 'test_swing_market_scanner.py'
      - 'test_swing_strength_engine.py'
      - 'test_swing_result_tracker.py'
      - 'test_swing_backtest.py'
      - 'test_telegram_manual_research.py'
      - 'test_swing_research_gate.py'
      - '.github/workflows/swing-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'swing_market_scanner.py'
      - 'swing_strength_engine.py'
      - 'swing_absorption.py'
      - 'test_swing_absorption.py'
      - 'swing_backtest.py'
      - 'telegram_manual_research.py'
      - 'test_swing_market_scanner.py'
      - 'test_swing_strength_engine.py'
      - 'test_swing_backtest.py'
      - 'test_telegram_manual_research.py'
      - '.github/workflows/swing-tests.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime dependencies
        run: pip install requests websocket-client
      - name: Compile primary scanner modules
        run: python -m py_compile main.py swing_market_scanner.py swing_strength_engine.py swing_result_tracker.py
      - name: Run SWING regression tests
        run: |
          python -m unittest -v \
            test_swing_market_scanner.py \
            test_swing_strength_engine.py \
            test_swing_result_tracker.py \
            test_swing_absorption.py \
            test_swing_backtest.py \
            test_swing_alert_state.py \
            test_telegram_manual_research.py
